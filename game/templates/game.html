<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kings Cup</title>
    <!-- Tailwind CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              'kc-accent': '#3b82f6',
              'kc-bg':     '#f8fafc',
              'kc-surface':'#ffffff',
              'kc-text':   '#0f172a',
              'kc-muted':  '#64748b',
              'kc-border': '#e2e8f0',
              'kc-danger': '#ef4444',
              'kc-success':'#22c55e',
            },
            borderRadius: {
              'kc': '0.75rem',
            }
          }
        }
      }
    </script>
    <link rel="stylesheet" href="/static/style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/simple-peer@9.11.1/simplepeer.min.js"></script>
</head>
<body>
    <div class="header">
        <div class="container-fluid">
            <div class="row align-items-center">
                <div class="col-md-4 text-center text-md-start mb-2 mb-md-0">
                    <h1 class="h4 mb-0">Kings Cup</h1>
                </div>
                <div class="col-md-8">
                    <div class="d-flex flex-wrap justify-content-center justify-content-md-end">
                        <button id="start-game-btn" class="btn btn-primary btn-custom" disabled>Start Game</button>
                        <button id="reset-btn" class="btn btn-secondary btn-custom">Reset</button>
                        <button id="leave-btn" class="btn btn-danger btn-custom">Leave Lobby</button>
                        <button id="copy-game-id-btn" class="btn btn-info btn-custom">Copy Game ID</button>
                        <button id="toggle-webcam-btn" class="btn btn-success btn-custom">Enable Webcam</button>
                        <button id="toggle-theme" class="btn btn-outline-secondary btn-custom">Toggle Dark Mode</button>
                    </div>
                    <p id="copy-status" class="text-success mt-2 text-center" style="display: none;">Game ID copied!</p>
                </div>
            </div>
        </div>
    </div>

    <div class="canvas-container">
        <canvas id="gameCanvas" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%;"></canvas>
    </div>
    <div class="canvas-container">
        <canvas id="cursorCanvas"></canvas>
    </div>

    <script type="module" src="static/main.js"></script>
</body>
</html>

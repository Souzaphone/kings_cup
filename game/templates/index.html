<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kings Cup</title>
    <link rel="stylesheet" href="/static/style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
</head>
<body>
    <div class="wrapper">
        <img src="/static/assets/beer.png" alt="beer">
        <h2>Kings Cup</h2>
        
        <!-- Player Name Input -->
        <div class="player-section">
            <label for="player-name">Player Name</label>
            <input type="text" id="player-name" placeholder="Enter your name">
        </div>

        <!-- Create Game Section -->
        <div class="create-section">
            <h3>Create New Game</h3>
            <div class="game-options">
                <label>
                    <input type="radio" name="game-type" value="public" checked> Public Game
                </label>
                <label>
                    <input type="radio" name="game-type" value="private"> Private Game
                </label>
            </div>
            <div id="password-section" style="display: none;">
                <label for="game-password">Password</label>
                <input type="password" id="game-password" placeholder="Enter password">
            </div>
            <button type="button" id="create-game-btn" disabled>Create Game</button>
        </div>

        <!-- Public Games List -->
        <div class="lobby-section">
            <h3>Public Games</h3>
            <button type="button" id="refresh-games-btn">Refresh</button>
            <div id="public-games-container">
                <div id="games-loading">Loading games...</div>
                <div id="no-games" style="display: none;">No public games available</div>
                <div id="games-list"></div>
            </div>
        </div>

        <!-- Manual Join Section -->
        <div class="join-section">
            <h3>Join by Game ID</h3>
            <label for="game-id">Game ID</label>
            <input type="text" id="game-id" placeholder="Enter game ID">
            <div id="manual-password-section" style="display: none;">
                <label for="join-password">Password</label>
                <input type="password" id="join-password" placeholder="Enter password">
            </div>
            <button type="button" id="join-game-btn" disabled>Join Game</button>
        </div>
    </div>

    <!-- Password Modal -->
    <div id="password-modal" class="modal" style="display: none;">
        <div class="modal-content">
            <h3>Enter Password</h3>
            <input type="password" id="modal-password" placeholder="Enter game password">
            <div class="modal-buttons">
                <button id="password-submit">Join</button>
                <button id="password-cancel">Cancel</button>
            </div>
        </div>
    </div>

    <script type="module" src="/static/main.js"></script>
    <style>
        .wrapper { max-width: 800px; margin: 0 auto; padding: 20px; }
        .player-section, .create-section, .lobby-section, .join-section { 
            margin: 20px 0; padding: 15px; border: 1px solid #ccc; border-radius: 5px; 
        }
        .game-options label { display: block; margin: 5px 0; }
        #public-games-container { max-height: 300px; overflow-y: auto; }
        .game-item { 
            padding: 10px; margin: 5px 0; border: 1px solid #ddd; border-radius: 3px; 
            display: flex; justify-content: space-between; align-items: center;
            cursor: pointer;
        }
        .game-item:hover { background-color: #f5f5f5; }
        .game-info { flex-grow: 1; }
        .game-meta { font-size: 0.9em; color: #666; }
        .modal { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(0,0,0,0.5); z-index: 1000;
        }
        .modal-content { 
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: white; padding: 20px; border-radius: 5px; min-width: 300px;
        }
        .modal-buttons { margin-top: 15px; text-align: right; }
        .modal-buttons button { margin-left: 10px; }
    </style>
</body>
</html>
